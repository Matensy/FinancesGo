{{define "loginpage"}}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · FinancesGo</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c5cff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 7 13.5 15.5 8.5 10.5 2 17'/%3E%3Cpolyline points='16 7 22 7 22 13'/%3E%3C/svg%3E">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand"><span class="mark"><svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span><span>FinancesGo</span></div>
    {{if .Error}}<div class="note danger">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <div class="field"><label>Senha</label><input name="password" type="password" autofocus required></div>
      <button class="btn primary block">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>{{end}}

{{define "content"}}{{end}}
