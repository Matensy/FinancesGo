{{define "loginpage"}}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · FinancesGo</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand"><span class="logo">💜</span><span>FinancesGo</span></div>
    {{if .Error}}<div class="alert danger">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <div class="field"><label>Senha</label><input name="password" type="password" autofocus required></div>
      <button class="btn primary block">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>{{end}}

{{define "content"}}{{end}}
